[project]
name = "brahmo"
version = "0.1.0"
description = "Deterministic clinical safety engine for Indian practice — Python core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brahmo"]

[tool.hatch.build.targets.wheel.force-include]
"src/brahmo/data" = "brahmo/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
