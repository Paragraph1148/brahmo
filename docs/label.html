<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relevance reading pass</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1d1b19; --muted: #6b6560;
    --line: #e5e0d8; --accent: #3b6ea5; --yes: #2f7a4f; --no: #a33a2e;
    --flag: #9a6a1f; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --panel: #201f24; --ink: #ece9e4; --muted: #9b948c;
      --line: #322f38; --accent: #7aa7d6; --yes: #5fbf87; --no: #e0796a;
      --flag: #d9a648; --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161a; --panel: #201f24; --ink: #ece9e4; --muted: #9b948c;
    --line: #322f38; --accent: #7aa7d6; --yes: #5fbf87; --no: #e0796a;
    --flag: #d9a648; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 96px; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .count { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 26px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .ctx { font-size: 13px; color: var(--muted); margin-bottom: 6px;
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .q { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
       border-radius: 6px; padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .q p { margin: 0; font-size: 17px; }
  .patient { font-size: 13px; color: var(--muted); margin: 8px 2px 20px; }
  .vs { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .14em;
        text-transform: uppercase; margin: 18px 0; }
  .doc { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         padding: 16px 18px; box-shadow: var(--shadow); }
  .doc .src { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
              color: var(--muted); margin-bottom: 8px; }
  .doc h2 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
  .doc p { margin: 0; }
  .keys { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
          border-top: 1px solid var(--line); padding: 10px 16px; display: flex;
          gap: 8px; justify-content: center; flex-wrap: wrap; }
  button { font: 500 14px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink);
           border-radius: 6px; padding: 9px 14px; }
  button:hover { border-color: var(--accent); }
  button kbd { font: 600 11px ui-monospace, monospace; opacity: .65; margin-right: 6px; }
  .b-yes { border-color: var(--yes); color: var(--yes); }
  .b-no  { border-color: var(--no);  color: var(--no); }
  .b-fl  { border-color: var(--flag); color: var(--flag); }
  .done { text-align: center; padding: 40px 0; }
  .done h2 { font-size: 22px; margin: 0 0 10px; }
  .note { font-size: 13px; color: var(--muted); max-width: 52ch; margin: 14px auto; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        padding: 12px; overflow: auto; font-size: 12px; max-height: 220px; text-align: left; }
  a { color: var(--accent); }
  @media (max-width: 480px) { .wrap { padding: 16px 16px 120px; } }
</style>
</head>

<script>
const DATA = {"documents": {"guideline:1": {"title": "Diagnosis", "text": "Diabetes diagnosis: FPG ≥126 mg/dL OR 2-h PG ≥200 mg/dL on 75g OGTT OR HbA1c ≥6.5%. Asymptomatic patients need confirmatory repeat test.", "source": "RSSDI 2022"}, "guideline:10": {"title": "Postprandial hyperglycemia", "text": "Target PPG <160 mg/dL. AGIs, glinides or SGLT2 inhibitors may be considered for PPG control. Indian diets cause higher PPG due to high-GI traditional foods.", "source": "RSSDI 2022"}, "guideline:11": {"title": "Limited care / resource-constrained", "text": "In resource-constrained settings: sulfonylurea or metformin or TZDs may be used. Newer SUs (gliclazide) preferred for low cost and reduced hypoglycemia vs older SUs.", "source": "RSSDI 2022"}, "guideline:12": {"title": "STEMI diagnosis", "text": "Diagnose STEMI based on ECG: ST elevation ≥1mm in 2 contiguous limb leads or ≥2mm in 2 contiguous precordial leads. Troponin (I or T) elevation >99th percentile confirms MI.", "source": "CSI 2017"}, "guideline:13": {"title": "STEMI primary PCI", "text": "Primary PCI is preferred reperfusion strategy if door-to-balloon time ≤90 min at PCI-capable center, or ≤120 min from first medical contact at non-PCI center.", "source": "CSI 2017"}, "guideline:14": {"title": "STEMI fibrinolysis when no PCI", "text": "If PCI not available within 120 min, give fibrinolysis within 30 min of arrival. Streptokinase (₹5-8K, non-fibrin-specific, 1h infusion) or Tenecteplase (₹25-35K, weight-based bolus, fibrin-specific). Tenecteplase preferred if affordable.", "source": "CSI 2017"}, "guideline:15": {"title": "STEMI dual antiplatelet", "text": "Loading: Aspirin 162-325mg PO + P2Y12 inhibitor. Ticagrelor 180mg preferred over Clopidogrel 600mg in ACS (PLATO). Continue DAPT 12 months post-ACS.", "source": "CSI 2017"}, "guideline:16": {"title": "STEMI anticoagulation", "text": "Anticoagulation in addition to antiplatelets: Unfractionated heparin IV bolus 60 U/kg + infusion, OR Enoxaparin 1 mg/kg SC BD (1 mg/kg OD if eGFR <30).", "source": "CSI 2017"}, "guideline:17": {"title": "Post-MI medication regimen", "text": "Post-MI: DAPT (aspirin + P2Y12i) for 12 months, statin (atorvastatin 80mg or rosuvastatin 40mg), beta blocker (carvedilol/metoprolol/bisoprolol), ACEi/ARB (ramipril/telmisartan).", "source": "CSI 2017"}, "guideline:18": {"title": "STEMI in non-PCI centers", "text": "In non-PCI capable hospitals: fibrinolysis within 30 min of arrival, then transfer to PCI-capable center within 24h (pharmaco-invasive strategy).", "source": "CSI 2020"}, "guideline:19": {"title": "Penicillin allergy considerations", "text": "Penicillin allergy is NOT a contraindication for aspirin, clopidogrel, ticagrelor, heparin, or fibrinolytics. Document allergy for antibiotic prescribing during admission.", "source": "CSI 2017"}, "guideline:2": {"title": "First-line therapy", "text": "Metformin is first-line at diagnosis combined with lifestyle intervention. If contraindicated: sulfonylurea, TZD, DPP4i, SGLT2i, AGI, or oral GLP-1 RA.", "source": "RSSDI 2022"}, "guideline:20": {"title": "AF stroke risk - CHA2DS2-VASc", "text": "Calculate CHA2DS2-VASc for non-valvular AF. Score ≥2 men or ≥3 women: oral anticoagulation indicated. Score 1 men or 2 women: consider OAC.", "source": "IHRS/CSI 2018"}, "guideline:21": {"title": "AF anticoagulation choice", "text": "Non-valvular AF: DOAC (apixaban, rivaroxaban, dabigatran) preferred over warfarin. Valvular (rheumatic) AF or mechanical valve: WARFARIN ONLY (DOACs contraindicated). RHD is common in India.", "source": "IHRS/CSI 2018"}, "guideline:22": {"title": "Triple therapy post-PCI + AF", "text": "Patients with AF + recent PCI requiring triple therapy: shorten triple therapy duration (1-4 weeks), then drop aspirin → continue P2Y12i + DOAC for up to 12 months, then DOAC alone.", "source": "IHRS/CSI 2018"}, "guideline:23": {"title": "Diabetes + HFrEF (EF <40%)", "text": "SGLT2 inhibitor (empagliflozin or dapagliflozin) is first-line: dual benefit for glycemia AND heart failure (EMPEROR-Reduced, DAPA-HF). Use regardless of HbA1c if T2DM + HFrEF.", "source": "RSSDI+CSI 2022"}, "guideline:24": {"title": "Diabetes + HF - drugs to AVOID", "text": "CONTRAINDICATED in HF: Pioglitazone (fluid retention), Saxagliptin (FDA black box - increased HF hospitalization in SAVOR-TIMI). CAUTION: Glimepiride/glibenclamide (hypoglycemia → cardiac events).", "source": "RSSDI+CSI 2022"}, "guideline:25": {"title": "Diabetes + HF + CKD hyperkalemia", "text": "In T2DM + HF + CKD on ACEi/ARB + spironolactone: monitor K+ at baseline, 1 week, then monthly. Hold spironolactone if K+ >5.5. Adding SGLT2i mitigates hyperkalemia risk.", "source": "RSSDI+CSI 2022"}, "guideline:26": {"title": "Diabetes + CKD drug choices", "text": "In T2DM + CKD: SGLT2i (empagliflozin/dapagliflozin) or GLP-1 RA preferred for renoprotection. ACEi/ARB mandatory if albuminuria. Linagliptin if DPP4i needed (no renal dose adjustment).", "source": "RSSDI 2022"}, "guideline:27": {"title": "Diabetes + NAFLD", "text": "Pioglitazone has evidence for NASH improvement. SGLT2i emerging data for NAFLD. Both beneficial in fatty liver - but Pioglitazone CONTRAINDICATED if concurrent HF.", "source": "RSSDI 2022"}, "guideline:28": {"title": "NLEM essential drugs - diabetes", "text": "NLEM 2022 includes: Metformin, Glibenclamide, Gliclazide, Glimepiride, Insulin (regular, NPH, premixed 30/70). These are price-controlled and available at Jan Aushadhi.", "source": "MoHFW_STG 2022"}, "guideline:29": {"title": "NLEM essential drugs - cardiovascular", "text": "NLEM 2022 cardiovascular: Aspirin, Clopidogrel, Atorvastatin, Ramipril, Enalapril, Telmisartan, Metoprolol, Atenolol, Furosemide, Spironolactone, Digoxin, Warfarin, Amiodarone, Heparin, Streptokinase, GTN, ISMN.", "source": "MoHFW_STG 2022"}, "guideline:3": {"title": "Dual therapy", "text": "Add SGLT2i, DPP4i, sulfonylurea, TZD, AGI or oral GLP-1 RA when targets not achieved on metformin. Patient-centric choice.", "source": "RSSDI 2022"}, "guideline:4": {"title": "ASCVD/HF/CKD comorbidity", "text": "In patients with established or high-risk ASCVD, heart failure, diabetic kidney disease, or need for weight loss: prefer SGLT2 inhibitors or GLP-1 RA.", "source": "RSSDI 2022"}, "guideline:5": {"title": "Elderly with hypoglycemia risk", "text": "In elderly patients with increased risk of hypoglycemia, use a DPP4 inhibitor as an alternative to sulfonylurea.", "source": "RSSDI 2022"}, "guideline:6": {"title": "HbA1c targets", "text": "General target HbA1c <7%. Stricter <6.5% for young, no comorbidities. Relaxed 7.5-8% for elderly with comorbidities, hypoglycemia history, or limited life expectancy.", "source": "RSSDI 2022"}, "guideline:7": {"title": "Insulin initiation", "text": "Initiate insulin in T2DM patients failing three oral agents, with HbA1c >1-1.5% above target, with severe symptomatic hyperglycemia, or in unstable state.", "source": "RSSDI 2022"}, "guideline:8": {"title": "Diet (Indian context)", "text": "Carbohydrates 50-60% of calories. Prefer complex carbs and low-GI foods. Limit white rice (GI 73); prefer brown rice (GI 68) or millets. Fiber 25-40g/day. Salt <5g/day.", "source": "RSSDI 2022"}, "guideline:9": {"title": "Physical activity", "text": "Minimum 150 min/week moderate aerobic activity. ≥30 min/day. Resistance training 3x/week. At least 5000 steps/day.", "source": "RSSDI 2022"}}, "questions": [{"id": "p1-hba1c-target", "patient_id": 1, "question": "He's on Metformin 2g and otherwise well. What HbA1c should I actually be targeting for a 48-year-old with no complications?", "probes": "lexical", "patient": "Patient 1 · 48M · T2DM (3yr); HTN (1yr) · on Metformin, Telmisartan", "candidates": ["guideline:11", "guideline:2", "guideline:3", "guideline:6", "guideline:1", "guideline:28", "guideline:7", "guideline:12", "guideline:23", "guideline:26", "guideline:14", "guideline:10", "guideline:13", "guideline:15", "guideline:16"]}, {"id": "p1-sulfa-rash-sulfonylurea", "patient_id": 1, "question": "He had a rash on cotrimoxazole years ago. Does that put sulfonylureas off the table?", "probes": "vocabulary-gap", "patient": "Patient 1 · 48M · T2DM (3yr); HTN (1yr) · on Metformin, Telmisartan", "candidates": ["guideline:11", "guideline:16", "guideline:1", "guideline:10", "guideline:12", "guideline:13", "guideline:14", "guideline:15", "guideline:19", "guideline:2", "guideline:24", "guideline:29", "guideline:3", "guideline:5"]}, {"id": "p1-white-rice", "patient_id": 1, "question": "He eats two cups of white rice at lunch every day. What do I tell him?", "probes": "lexical", "patient": "Patient 1 · 48M · T2DM (3yr); HTN (1yr) · on Metformin, Telmisartan", "candidates": ["guideline:12", "guideline:8", "guideline:9", "guideline:1", "guideline:10", "guideline:11", "guideline:13", "guideline:14", "guideline:16", "guideline:15", "guideline:5", "guideline:6", "guideline:7"]}, {"id": "p1-htn-changes-choice", "patient_id": 1, "question": "His BP is 134/86 on telmisartan. Does the hypertension change which second agent I add for his diabetes?", "probes": "distractor", "patient": "Patient 1 · 48M · T2DM (3yr); HTN (1yr) · on Metformin, Telmisartan", "candidates": ["guideline:1", "guideline:17", "guideline:23", "guideline:29", "guideline:28", "guideline:12", "guideline:24", "guideline:25", "guideline:27", "guideline:3", "guideline:10", "guideline:26", "guideline:11", "guideline:13", "guideline:14", "guideline:15", "guideline:16", "guideline:7"]}, {"id": "p1-exercise-prescription", "patient_id": 1, "question": "How much exercise should I be prescribing alongside the drugs?", "probes": "lexical", "patient": "Patient 1 · 48M · T2DM (3yr); HTN (1yr) · on Metformin, Telmisartan", "candidates": ["guideline:12", "guideline:19", "guideline:24", "guideline:28", "guideline:29", "guideline:1", "guideline:10", "guideline:11", "guideline:13", "guideline:14", "guideline:15", "guideline:16", "guideline:17", "guideline:22", "guideline:6", "guideline:9"]}, {"id": "p2-metformin-at-egfr-32", "patient_id": 2, "question": "Her eGFR is 32. Can she stay on metformin at all, or does it come off now?", "probes": "lexical", "patient": "Patient 2 · 62F · T2DM (12yr); CKD 3b; HTN; Proliferative Retinopathy; Neuropathy · on Metformin, Glimepiride, Atorvastatin, Telmisartan, Aspirin, Pregabalin", "candidates": ["guideline:11", "guideline:16", "guideline:2", "guideline:28", "guideline:3", "guideline:1", "guideline:10", "guideline:12", "guideline:13", "guideline:14", "guideline:15", "guideline:17", "guideline:23", "guideline:29"]}, {"id": "p2-pregabalin-interaction", "patient_id": 2, "question": "She takes pregabalin 75mg BD for her neuropathy. Is there anything about that combination with her diabetes regimen I should know?", "probes": "negative", "patient": "Patient 2 · 62F · T2DM (12yr); CKD 3b; HTN; Proliferative Retinopathy; Neuropathy · on Metformin, Glimepiride, Atorvastatin, Telmisartan, Aspirin, Pregabalin", "candidates": ["guideline:1", "guideline:16", "guideline:17", "guideline:23", "guideline:24", "guideline:28", "guideline:27", "guideline:12", "guideline:26", "guideline:10", "guideline:11", "guideline:13", "guideline:14", "guideline:15", "guideline:2"]}, {"id": "p2-which-dpp4-in-ckd", "patient_id": 2, "question": "If I want a gliptin at this level of renal function, which one avoids dose adjustment?", "probes": "vocabulary-gap", "patient": "Patient 2 · 62F · T2DM (12yr); CKD 3b; HTN; Proliferative Retinopathy; Neuropathy · on Metformin, Glimepiride, Atorvastatin, Telmisartan, Aspirin, Pregabalin", "candidates": ["guideline:12", "guideline:26", "guideline:1", "guideline:11", "guideline:10", "guideline:13", "guideline:14", "guideline:15", "guideline:16", "guideline:2", "guideline:23", "guideline:24", "guideline:3", "guideline:4"]}, {"id": "p2-retinopathy-correction-speed", "patient_id": 2, "question": "Her retinopathy is proliferative. Should I worry about correcting an HbA1c of 9.2 too quickly?", "probes": "negative", "patient": "Patient 2 · 62F · T2DM (12yr); CKD 3b; HTN; Proliferative Retinopathy; Neuropathy · on Metformin, Glimepiride, Atorvastatin, Telmisartan, Aspirin, Pregabalin", "candidates": ["guideline:1", "guideline:12", "guideline:23", "guideline:6", "guideline:7", "guideline:20", "guideline:10", "guideline:11", "guideline:14", "guideline:13", "guideline:15", "guideline:16", "guideline:24", "guideline:4", "guideline:5"]}, {"id": "p2-sglt2-at-egfr-32", "patient_id": 2, "question": "Is she still a candidate for an SGLT2 inhibitor at an eGFR of 32, given she also has albuminuria?", "probes": "multi-hop", "patient": "Patient 2 · 62F · T2DM (12yr); CKD 3b; HTN; Proliferative Retinopathy; Neuropathy · on Metformin, Glimepiride, Atorvastatin, Telmisartan, Aspirin, Pregabalin", "candidates": ["guideline:10", "guideline:16", "guideline:15", "guideline:23", "guideline:26", "guideline:27", "guideline:4", "guideline:5", "guideline:1", "guideline:11", "guideline:12", "guideline:13", "guideline:14", "guideline:2", "guideline:3"]}, {"id": "p2-aspirin-primary-prevention", "patient_id": 2, "question": "She's on aspirin 75mg. With an eGFR of 32 and no prior cardiac event, is that still appropriate?", "probes": "distractor", "patient": "Patient 2 · 62F · T2DM (12yr); CKD 3b; HTN; Proliferative Retinopathy; Neuropathy · on Metformin, Glimepiride, Atorvastatin, Telmisartan, Aspirin, Pregabalin", "candidates": ["guideline:15", "guideline:16", "guideline:19", "guideline:24", "guideline:26", "guideline:29", "guideline:14", "guideline:17", "guideline:22", "guideline:1", "guideline:6", "guideline:10", "guideline:11", "guideline:12", "guideline:13", "guideline:4"]}, {"id": "p3-occupational-hypoglycemia", "patient_id": 3, "question": "He drives an auto-rickshaw twelve hours a day. Which agents are unsafe for someone doing that?", "probes": "vocabulary-gap", "patient": "Patient 3 · 34M · T2DM (2mo, newly diagnosed); Obesity; NAFLD · on Metformin", "candidates": ["guideline:7", "guideline:8", "guideline:9", "guideli perglycemia (newly detected); Hypertension (newly diagnosed) · on no medications", "candidates": ["guideline:12", "guideline:13", "guideline:15", "guideline:17", "guideline:18", "guideline:19", "guideline:16", "guideline:29", "guideline:14", "guideline:22", "guideline:1", "guideline:10", "guideline:11"]}, {"id": "p9-new-hyperglycemia", "patient_id": 9, "question": "His glucose is 340 with no prior diabetes history. Do I treat this as new diabetes or as a stress response?", "probes": "vocabulary-gap", "patient": "Patient 9 · 60M · Chest pain (acute, 4 hours); Hyperglycemia (newly detected); Hypertension (newly diagnosed) · on no medications", "candidates": ["guideline:1", "guideline:23", "guideline:6", "guideline:24", "guideline:26", "guideline:27", "guideline:28", "guideline:12", "guideline:10", "guideline:11", "guideline:14", "guideline:25", "guideline:13", "guideline:15", "guideline:16", "guideline:5", "guideline:7"]}, {"id": "p9-uninsured-thrombolytic", "patient_id": 9, "question": "He has no insurance and no savings. Which reperfusion option can he actually afford?", "probes": "cost", "patient": "Patient 9 · 60M · Chest pain (acute, 4 hours); Hyperglycemia (newly detected); Hypertension (newly diagnosed) · on no medications", "candidates": ["guideline:13", "guideline:14", "guideline:26", "guideline:27", "guideline:6", "guideline:11", "guideline:1", "guideline:10", "guideline:16", "guideline:12", "guideline:15", "guideline:21", "guideline:28", "guideline:9"]}, {"id": "p9-hyperglycemia-changes-reperfusion", "patient_id": 9, "question": "Does the hyperglycaemia change the reperfusion decision at all, or do I treat the STEMI exactly as I would otherwise?", "probes": "negative", "patient": "Patient 9 · 60M · Chest pain (acute, 4 hours); Hyperglycemia (newly detected); Hypertension (newly diagnosed) · on no medications", "candidates": ["guideline:12", "guideline:13", "guideline:14", "guideline:15", "guideline:16", "guideline:18", "guideline:10", "guideline:1", "guideline:11", "guideline:7"]}]};
const KEY = "brahmo-reading-pass-v1";

const pairs = [];
for (const q of DATA.questions)
  for (const c of q.candidates) pairs.push({ qid: q.id, doc: c });

let grades = {};
try { grades = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { grades = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(grades)); } catch (e) {} };
const id = (p) => p.qid + "|" + p.doc;

let i = pairs.findIndex((p) => grades[id(p)] === undefined);
if (i < 0) i = pairs.length;

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function grade(v) {
  if (i >= pairs.length) return;
  grades[id(pairs[i])] = v;
  save(); i++; render();
}
function undo() { if (i > 0) { i--; delete grades[id(pairs[i])]; save(); render(); } }

function exportJson() {
  const out = { schema: 1, corpus: "guidelines", reviewed: false,
    reading_pass_complete: pairs.every((p) => grades[id(p)] !== undefined),
    about: ["Reading pass output. Grade 1 = the text answers the question, settled by",
            "reading. Grade 2 = flagged as clinically essential by a non-clinician and",
            "NOT yet confirmed; treat as a 1 with a question mark until a clinician sees it."],
    queries: DATA.questions.map((q) => ({
      id: q.id, patient_id: q.patient_id, question: q.question, probes: q.probes,
      rationale: "",
      judgments: Object.fromEntries(
        q.candidates.map((d) => [d, grades[q.id + "|" + d] || 0]).filter(([, g]) => g > 0)),
    })),
  };
  const blob = new Blob([JSON.stringify(out, null, 2) + "\n"], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "judgments-reading-pass.json"; a.click();
}

function render() {
  const app = document.getElementById("app"), keys = document.getElementById("keys");
  const done = pairs.filter((p) => grades[id(p)] !== undefined).length;

  if (i >= pairs.length) {
    const yes = Object.values(grades).filter((g) => g > 0).length;
    const flagged = Object.values(grades).filter((g) => g === 2).length;
    app.innerHTML = `<div class="done"><h2>Reading pass complete</h2>
      <p class="count">${pairs.length} judged · ${yes} relevant · ${flagged} flagged for a clinician</p>
      <p class="note">Download the file and merge it into
      <code>backend/src/brahmo/ir/data/judgments.json</code>. The flagged ones are
      proposals, not clinical judgments — they stay marked until a clinician confirms them.</p></div>`;
    keys.innerHTML = `<button onclick="exportJson()"><kbd>E</kbd>Download JSON</button>
      <button onclick="undo()"><kbd>U</kbd>Back one</button>`;
    return;
  }

  const p = pairs[i];
  const q = DATA.questions.find((x) => x.id === p.qid);
  const d = DATA.documents[p.doc];
  app.innerHTML = `
    <header><h1>Does this text answer this question?</h1>
      <span class="count">${done} / ${pairs.length}</span></header>
    <div class="bar"><i style="width:${(100 * done) / pairs.length}%"></i></div>
    <div class="ctx">${esc(q.id)} · probes: ${esc(q.probes)}</div>
    <div class="q"><p>${esc(q.question)}</p></div>
    <div class="patient">${esc(q.patient)}</div>
    <div class="vs">against</div>
    <div class="doc"><div class="src">${esc(p.doc)} · ${esc(d.source)}</div>
      <h2>${esc(d.title)}</h2><p>${esc(d.text)}</p></div>`;
  keys.innerHTML = `
    <button class="b-no"  onclick="grade(0)"><kbd>N</kbd>No</button>
    <button class="b-yes" onclick="grade(1)"><kbd>Y</kbd>Yes, it answers it</button>
    <button class="b-fl"  onclick="grade(2)"><kbd>E</kbd>Yes &amp; looks essential</button>
    <button onclick="undo()"><kbd>U</kbd>Back</button>`;
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "n" || k === "0") { e.preventDefault(); grade(0); }
  else if (k === "y" || k === "1") { e.preventDefault(); grade(1); }
  else if (k === "e" || k === "2") { e.preventDefault(); i >= pairs.length ? exportJson() : grade(2); }
  else if (k === "u" || k === "backspace") { e.preventDefault(); undo(); }
});

render();
</script>
